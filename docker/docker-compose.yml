# ===========================================
# OpenClaw Bot - Production Execution
# ===========================================
# 用途: 正式運行 OpenClaw Gateway
# 執行: docker-compose up -d
# 停止: docker-compose down
# 日誌: docker-compose logs -f
# ===========================================

services:
  openclaw-gateway:
    image: openclaw-bot:local
    container_name: openclaw-gateway
    restart: unless-stopped
    
    # Gateway 模式運行
    command: ["gateway"]
    
    # 環境變數
    environment:
      - NODE_ENV=production
      # 防止 Node.js 互動式 prompt
      - CI=true
    
    # 資料掛載
    volumes:
      - ../openclaw-data:/root/.openclaw
    
    # Gateway API 端口 (可選，用於外部 API 呼叫)
    # 預設 bind 到 loopback，需要改 openclaw.json 才能外部存取
    # ports:
    #   - "18789:18789"
    
    # 健康檢查
    healthcheck:
      test: ["CMD", "pgrep", "-f", "openclaw"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # 資源限制 (可依需求調整)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
